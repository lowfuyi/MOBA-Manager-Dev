<link rel='apple-touch-startup-image' media='screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)' href='splash_750x1334.png'>
<style>
body, #status { background-color: #0a1120; }
#status-progress { width: 60%; height: 16px; accent-color: #3fd0b8; }
#gl-note { position: absolute; bottom: 4%; left: 0; right: 0; text-align: center; color: #8ea0b8; font: 15px/1.4 Arial, sans-serif; padding: 0 16px; }
</style>
<script>
(function () {
  document.addEventListener('DOMContentLoaded', function () {
    var s = document.getElementById('status');
    if (!s) { return; }
    var d = document.createElement('div');
    d.id = 'gl-note';
    d.textContent = 'Gloamline playtest - build __GL_BUILD__ - loading';
    s.appendChild(d);
  });
  // Always the newest build: check the service worker on every load; a new one takes over and the page reloads once.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration().then(function (r) {
      if (!r) { return; }
      var ask = function (w) { if (w && navigator.serviceWorker.controller) { w.postMessage('update'); } };
      if (r.waiting) { ask(r.waiting); }
      r.addEventListener('updatefound', function () {
        var w = r.installing;
        if (w) { w.addEventListener('statechange', function () { if (w.state === 'installed') { ask(w); } }); }
      });
      r.update();
    });
  }
})();
</script>"
